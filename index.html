<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>인사팀 위클리 보고</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f7f6f3;--bg3:#f0efe9;
  --text:#1a1a18;--text2:#6b6a65;--text3:#9c9a92;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --green:#1D9E75;--red:#A32D2D;--blue:#185FA5;
  --amber-bg:#FAEEDA;--amber-bd:#EF9F27;--amber-t:#633806;
  --coral-bg:#FAECE7;--coral-t:#993C1D;
  --r:8px;--rl:12px;
}
html,body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:transparent;color:var(--text);min-height:100vh;}
/* 날씨 배경 */
#wx-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px 60px;}
.center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
/* 인증 */
.auth-logo{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--text3);margin-bottom:28px;text-transform:uppercase;}
.auth-card{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:.5px solid var(--border);border-radius:var(--rl);padding:28px 24px;width:100%;max-width:360px;}
.auth-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6;}
.field-lbl{font-size:11px;color:var(--text2);margin-bottom:5px;}
.field-inp{width:100%;font-size:14px;font-family:inherit;border:.5px solid var(--border2);border-radius:var(--r);padding:9px 12px;background:var(--bg2);color:var(--text);margin-bottom:6px;}
.field-inp:focus{outline:none;background:var(--bg);}
.auth-btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:var(--r);padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;}
.auth-btn:hover{opacity:.85;}
.auth-btn:disabled{opacity:.38;cursor:not-allowed;}
.auth-err{font-size:12px;color:var(--red);min-height:18px;}
.auth-note{font-size:11px;color:var(--text3);margin-top:14px;padding-top:12px;border-top:.5px solid var(--border);line-height:1.65;}
/* 앱 헤더 */
.app-header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 0 12px;}
.app-title{font-size:18px;font-weight:700;}
.app-sub{font-size:12px;color:var(--text2);margin-top:3px;}
.hdr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
/* 날씨 스트립 */
.wx-strip{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--rl);background:rgba(255,255,255,.6);backdrop-filter:blur(8px);border:.5px solid rgba(255,255,255,.85);flex-shrink:0;}
.wx-em{font-size:18px;line-height:1;}
.wx-temp{font-size:14px;font-weight:700;}
.wx-date{font-size:10px;color:var(--text2);}
/* 버튼들 */
.btn-action{background:none;border:.5px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;backdrop-filter:blur(4px);background:rgba(255,255,255,.6);}
.btn-action:hover{background:rgba(255,255,255,.9);}
.btn-save{background:var(--text);color:var(--bg);border:none;border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-save:hover{opacity:.85;}
.btn-save:disabled{opacity:.38;cursor:not-allowed;}
.save-st{font-size:11px;color:var(--text3);}
/* 주차 바 */
.week-bar{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border:.5px solid rgba(255,255,255,.9);border-radius:var(--rl);padding:10px 14px;margin-bottom:10px;}
.week-bar-row{display:flex;align-items:center;gap:8px;}
.week-bar select{flex:1;font-size:13px;font-family:inherit;background:none;border:none;color:var(--text);cursor:pointer;outline:none;}
.wbadge{font-size:11px;border-radius:4px;padding:2px 8px;font-weight:600;flex-shrink:0;}
.wbadge.now{background:#EAF3DE;color:#3B6D11;}
.wbadge.next{background:#E6F1FB;color:#185FA5;}
.wbadge.past{background:var(--bg2);color:var(--text2);}
.btn-nw{font-size:12px;background:var(--blue);color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit;font-weight:600;flex-shrink:0;white-space:nowrap;}
.nw-hint{font-size:11px;color:var(--blue);margin-top:6px;padding-top:6px;border-top:.5px solid var(--border);}
/* 배너 */
.banner{border-radius:var(--r);padding:10px 14px;font-size:12px;margin-bottom:12px;}
.banner.ro{background:var(--amber-bg);border:.5px solid var(--amber-bd);color:var(--amber-t);}
.banner.nw{background:#E6F1FB;border:.5px solid var(--blue);color:var(--blue);}
/* 탭 */
.tabs{display:flex;border-bottom:.5px solid var(--border);margin-bottom:20px;}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 16px;font-size:14px;color:var(--text2);cursor:pointer;font-family:inherit;margin-bottom:-1px;}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--text);}
/* 카드 */
.card{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border:.5px solid rgba(255,255,255,.95);border-radius:var(--rl);padding:18px;margin-bottom:12px;}
.card.warn{border-color:var(--amber-bd);}
.mhd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.nm{flex:1;font-size:15px;font-weight:600;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0;}
.dot.on{background:var(--green);}
.sec-row{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.sec-n{font-size:11px;font-weight:600;background:var(--bg2);border:.5px solid var(--border);border-radius:5px;padding:2px 7px;flex-shrink:0;}
.sec-n.w{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-t);}
.sec-label{font-size:12px;font-weight:600;color:var(--text2);}
.sec-label.w{color:var(--amber-t);}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.col-lbl{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:600;}
textarea{width:100%;font-size:13px;font-family:inherit;border:.5px solid var(--border);border-radius:var(--r);padding:8px 10px;background:rgba(247,246,243,.85);color:var(--text);resize:none;min-height:100px;line-height:1.7;overflow:hidden;}
textarea:focus{outline:none;border-color:var(--border2);background:var(--bg);}
textarea:disabled{opacity:.6;cursor:not-allowed;}
textarea.sm{min-height:80px;}
textarea.ceo-ta{min-height:80px;border-color:var(--amber-bd);}
.dv{height:.5px;background:var(--border);margin:14px 0;}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.btn-p{background:var(--text);color:var(--bg);border:none;border-radius:var(--r);padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-p:hover{opacity:.85;}
.btn-s{background:rgba(255,255,255,.7);border:.5px solid var(--border2);border-radius:var(--r);padding:7px 14px;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;}
.btn-s:hover{background:rgba(255,255,255,.95);}
/* 대표님 뷰 */
.sec-lbl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;}
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.lead-card{background:rgba(255,255,255,.92);border:1.5px solid var(--text);border-radius:var(--rl);padding:20px;margin-bottom:16px;}
.lead-name{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.lead-badge{font-size:10px;background:var(--text);color:var(--bg);border-radius:4px;padding:2px 7px;font-weight:700;}
.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
.lead-lbl{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.lead-val{font-size:13px;line-height:1.65;white-space:pre-wrap;}
.team-sec-lbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.team-card{background:rgba(247,246,243,.8);border:.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;}
.team-name{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.team-lbl{font-size:10px;font-weight:600;color:var(--text3);margin-bottom:2px;}
.team-val{font-size:11px;line-height:1.55;white-space:pre-wrap;color:var(--text2);}
.tag-w{display:inline-block;font-size:10px;background:var(--coral-bg);color:var(--coral-t);border-radius:4px;padding:1px 6px;margin-top:3px;}
.eh{color:var(--text3);font-size:13px;font-style:italic;}
/* 히스토리 */
.hw-card{background:rgba(255,255,255,.88);border:.5px solid var(--border);border-radius:var(--rl);padding:14px 18px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.hw-card:hover{border-color:var(--border2);}
/* 버전 패널 */
.ver-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.22);z-index:200;display:none;}
.ver-overlay.open{display:block;}
.ver-panel{position:fixed;top:0;right:0;height:100vh;width:300px;background:var(--bg);border-left:.5px solid var(--border);z-index:201;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;display:flex;flex-direction:column;}
.ver-panel.open{transform:translateX(0);}
.ver-hd{padding:18px 18px 14px;border-bottom:.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.ver-title{font-size:15px;font-weight:700;}
.ver-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);}
.ver-body{padding:14px 18px;flex:1;overflow-y:auto;}
.ver-item{padding:12px 14px;border:.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;}
.ver-time{font-size:13px;font-weight:600;margin-bottom:2px;}
.ver-ago{font-size:11px;color:var(--text3);margin-bottom:8px;}
.ver-btn{font-size:12px;background:none;border:.5px solid var(--border2);border-radius:5px;padding:4px 10px;cursor:pointer;font-family:inherit;color:var(--text2);}
.ver-btn:hover{background:var(--bg2);}
.conflict-box{background:var(--amber-bg);border:.5px solid var(--amber-bd);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--amber-t);display:none;}
/* 설정 */
.set-row{display:flex;gap:8px;margin-top:10px;}
.set-row input{flex:1;font-size:13px;font-family:inherit;border:.5px solid var(--border2);border-radius:var(--r);padding:7px 10px;background:var(--bg2);color:var(--text);}
.set-row input:focus{outline:none;}
.set-msg{font-size:11px;margin-top:4px;min-height:16px;}
/* 로딩 */
.ld{display:flex;gap:5px;align-items:center;}
.ldd{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:pulse 1.1s infinite;}
.ldd:nth-child(2){animation-delay:.18s;}
.ldd:nth-child(3){animation-delay:.36s;}
@keyframes pulse{0%,80%,100%{transform:scale(.55)}40%{transform:scale(1)}}
</style>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="wx-bg"></div>

<!-- 잠금 화면 -->
<div id="sc-lock" class="center" style="display:none;">
  <div class="auth-logo">HR Weekly</div>
  <div class="auth-card">
    <div class="auth-title">비밀번호 입력</div>
    <div class="auth-sub">인사팀 위클리 보고 시스템입니다.</div>
    <div class="field-lbl">비밀번호</div>
    <input class="field-inp" type="password" id="lock-pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')unlock();" autocomplete="current-password"/>
    <div class="auth-err" id="lock-err"></div>
    <button class="auth-btn" id="unlock-btn" onclick="unlock()">입장하기</button>
    <div class="auth-note">이 링크와 비밀번호는 팀 내부에서만 공유해주세요.</div>
  </div>
</div>

<!-- 로딩 화면 -->
<div id="sc-loading" class="center" style="display:none;">
  <div class="ld"><div class="ldd"></div><div class="ldd"></div><div class="ldd"></div></div>
  <div style="font-size:13px;color:var(--text2);margin-top:12px;">불러오는 중...</div>
</div>

<!-- 버전 히스토리 패널 -->
<div class="ver-overlay" id="ver-overlay" onclick="closeVer()"></div>
<div class="ver-panel" id="ver-panel">
  <div class="ver-hd">
    <div class="ver-title">⏱ 저장 기록</div>
    <button class="ver-close" onclick="closeVer()">×</button>
  </div>
  <div class="ver-body">
    <div class="conflict-box" id="conflict-box">
      ⚠️ 다른 사람이 저장한 내용이 있어요.
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="ver-btn" style="background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-t);" onclick="forceRefresh()">최신 버전 불러오기</button>
        <button class="ver-btn" onclick="closeVer()">무시하고 계속</button>
      </div>
    </div>
    <div id="ver-list"></div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="sc-app" style="display:none;">
  <div class="page">
    <!-- 헤더 -->
    <div class="app-header">
      <div>
        <div class="app-title">인사팀 위클리 보고</div>
        <div class="app-sub" id="wk-lbl"></div>
      </div>
      <div class="hdr">
        <div class="wx-strip">
          <span class="wx-em" id="wx-em">☀️</span>
          <div>
            <div class="wx-temp" id="wx-temp"></div>
            <div class="wx-date" id="wx-date"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 액션 버튼 바 -->
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <span class="save-st" id="sv-st" style="flex:1;font-size:11px;color:var(--text3);"></span>
      <button class="btn-action" onclick="openVer()">⏱ 저장 기록</button>
      <button class="btn-action" onclick="doRefresh()">↻ 새로고침</button>
      <button class="btn-save" id="save-btn" onclick="doSave()">저장</button>
      <button class="btn-action" onclick="doLock()">잠금</button>
    </div>
    <!-- 주차 선택 -->
    <div class="week-bar">
      <div class="week-bar-row">
        <select id="week-sel" onchange="onWeekChange(this.value)"></select>
        <span class="wbadge" id="wbadge">이번 주</span>
        <button class="btn-nw" id="nw-btn" style="display:none;" onclick="startNextWeek()">다음 주 미리 작성</button>
      </div>
      <div class="nw-hint" id="nw-hint" style="display:none;">목~일요일에 다음 주 보고서를 미리 작성할 수 있어요.</div>
    </div>
    <div class="banner ro" id="ban-ro" style="display:none;">과거 주차는 읽기 전용입니다.</div>
    <div class="banner nw" id="ban-nw" style="display:none;">다음 주 보고서를 미리 작성 중이에요.</div>
    <!-- 탭 -->
    <div class="tabs">
      <button class="tab on" id="t1" onclick="sw('input')">팀원 입력</button>
      <button class="tab" id="t2" onclick="sw('ceo')">대표님 뷰</button>
      <button class="tab" id="t3" onclick="sw('history')">히스토리</button>
      <button class="tab" id="t4" onclick="sw('settings')">설정</button>
    </div>
    <!-- 팀원 입력 -->
    <div id="pg-input">
      <div class="card warn">
        <div class="sec-row" style="margin-bottom:8px;">
          <span class="sec-n w">★</span>
          <span class="sec-label w">대표님 지시 / 요청사항</span>
        </div>
        <textarea class="ceo-ta" id="ceo-in" placeholder="이번 주 위클리에서 받은 지시·요청사항..." oninput="dirty()"></textarea>
      </div>
      <div id="mc"></div>
      <div class="row-end">
        <button class="btn-s" onclick="doSave()">저장</button>
        <button class="btn-p" onclick="doSave().then(()=>sw('ceo'))">저장하고 대표님 뷰 →</button>
      </div>
    </div>
    <!-- 대표님 뷰 -->
    <div id="pg-ceo" style="display:none;">
      <div id="ceo-vw" style="display:none;margin-bottom:16px;">
        <div class="sec-lbl">대표님 지시 / 요청사항</div>
        <div style="background:var(--amber-bg);border:.5px solid var(--amber-bd);border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.7;" id="ceo-vt"></div>
      </div>
      <div class="sec-lbl">이번 주 보고</div>
      <div id="lead-wrap"></div>
      <div id="team-outer" style="display:none;">
        <div class="team-sec-lbl">팀원 보고</div>
        <div id="team-wrap"></div>
      </div>
      <div class="dv"></div>
      <div style="display:flex;justify-content:flex-end;"><button class="btn-s" onclick="cpAll(this)">전체 보고서 복사</button></div>
    </div>
    <!-- 히스토리 -->
    <div id="pg-history" style="display:none;">
      <div class="sec-lbl">주차별 기록</div>
      <div id="hw-list"></div>
    </div>
    <!-- 설정 -->
    <div id="pg-settings" style="display:none;">
      <div class="card">
        <div class="sec-lbl">비밀번호 변경</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:8px;">변경 후 팀원들에게 새 비밀번호를 알려주세요.</div>
        <div class="set-row">
          <input type="password" id="npw1" placeholder="새 비밀번호" autocomplete="new-password"/>
          <input type="password" id="npw2" placeholder="확인" autocomplete="new-password"/>
          <button class="btn-s" onclick="changePw()">변경</button>
        </div>
        <div class="set-msg" id="pw-msg"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── 상수
const FB   = 'https://sirloinhr-default-rtdb.asia-southeast1.firebasedatabase.app';

// Firebase 초기화 & 익명 인증
const _fbApp = firebase.initializeApp({
  apiKey: "AIzaSyDYikN7ttxI7guzqijsppNwVIJMNZPtQLw",
  authDomain: "sirloinhr.firebaseapp.com",
  databaseURL: FB,
  projectId: "sirloinhr",
  storageBucket: "sirloinhr.firebasestorage.app",
  messagingSenderId: "869771151725",
  appId: "1:869771151725:web:a82a4425e2f5e66045f264",
});
const _fbAuth = firebase.auth(_fbApp);
let _authReady = false;
const _authPromise = _fbAuth.signInAnonymously().then(()=>{ _authReady=true; }).catch(e=>{ console.log('익명 인증 실패, 계속 진행:', e.message); _authReady=true; });
const CATS = [{id:'rec',num:'1',name:'채용'},{id:'eval',num:'2',name:'평가·보상·급여'},{id:'etc',num:'3',name:'기타'}];
const MEMBERS = ['류효인','허원희','김명진'];
const LEAD    = '류효인';
const MAX_H   = 10;
const AV_BG   = ['#E6F1FB','#EAF3DE','#FAEEDA','#FAECE7'];
const AV_FG   = ['#185FA5','#3B6D11','#854F0B','#993C1D'];

// ── 상태
let ms=[], ceo='', curKey='', allWeeks=[], isRO=false, isDirty=false, loadedAt=null;

// ── Firebase 경로
const fbWeeksShallow = ()=> FB+'/weeks.json?shallow=true';
const fbWeek  = k => FB+'/weeks/'+k+'.json';
const fbAuth  = ()=> FB+'/weekly_auth.json';

// ── 화면 전환
function show(id){
  ['sc-lock','sc-loading','sc-app'].forEach(s=>{
    document.getElementById(s).style.display = s===id ? 'block' : 'none';
  });
}

// ── 비밀번호 해시
async function sha256(s){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+'_wk25'));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch{ return btoa(s+'_wk25'); }
}

// hardcoded fallback: "sirhr0905"
const _D=[126,125,105,74,91,0,14,14,112];
function _ck(pw){ return pw.length===_D.length && [...pw].every((c,i)=>(c.charCodeAt(0)^(i*7+13))===_D[i]); }

// ── 주차 키 계산
function weekKey(offset=0){
  const d=new Date(); if(offset) d.setDate(d.getDate()+offset*7);
  const day=d.getDay()||7;
  const mon=new Date(d); mon.setDate(d.getDate()-day+1);
  const yr=mon.getFullYear();
  const jan1=new Date(yr,0,1);
  const wn=Math.ceil(((mon-jan1)/86400000+(jan1.getDay()||7)-1)/7)+1;
  return `${yr}_W${String(wn).padStart(2,'0')}`;
}
const todayKey = ()=>weekKey(0);
const nextKey  = ()=>weekKey(1);

function weekLabel(key){
  const [yr,wp]=key.split('_');
  const wn=parseInt(wp.replace('W',''));
  const jan1=new Date(parseInt(yr),0,1);
  const fm=new Date(jan1);
  fm.setDate(jan1.getDate()+((8-(jan1.getDay()||7))%7||7)-7);
  const mon=new Date(fm); mon.setDate(fm.getDate()+(wn-1)*7);
  const fri=new Date(mon); fri.setDate(mon.getDate()+4);
  const f=x=>`${x.getMonth()+1}/${x.getDate()}`;
  return `${mon.getFullYear()}년 ${mon.getMonth()+1}월 ${Math.ceil(mon.getDate()/7)}주차 (${f(mon)} ~ ${f(fri)})`;
}

// ── 기본 데이터
function mkM(id,name){
  const m={id,name,notes:''};
  CATS.forEach(c=>{m['t_'+c.id]='';m['n_'+c.id]='';});
  return m;
}
function dfltMs(){ return MEMBERS.map((n,i)=>mkM(i+1,n)); }
function hasCont(m){ return CATS.some(c=>m['t_'+c.id]||m['n_'+c.id])||m.notes; }

// ── textarea 높이 자동조절
function autoResize(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function initResize(){ document.querySelectorAll('textarea').forEach(el=>{ autoResize(el); el.addEventListener('input',()=>autoResize(el)); }); }

// ── 잠금/해제
async function unlock(){
  const pw=document.getElementById('lock-pw').value;
  const err=document.getElementById('lock-err');
  const btn=document.getElementById('unlock-btn');
  if(!pw){err.textContent='비밀번호를 입력해주세요.';return;}
  btn.disabled=true; btn.textContent='확인 중...'; err.textContent='';
  let ok=false;
  try{
    const r=await fetch(fbAuth());
    if(r.ok){ const d=await r.json(); if(d&&d.hash){ const h=await sha256(pw); ok=(h===d.hash); } }
  }catch{}
  if(!ok) ok=_ck(pw);
  if(ok){ await loadAndShow(); }
  else{ err.textContent='비밀번호가 올바르지 않습니다.'; document.getElementById('lock-pw').value=''; document.getElementById('lock-pw').focus(); }
  btn.disabled=false; btn.textContent='입장하기';
}

function doLock(){
  if(isDirty&&!confirm('저장하지 않은 내용이 있습니다. 잠금하시겠어요?'))return;
  show('sc-lock');
  document.getElementById('lock-pw').value='';
  document.getElementById('lock-err').textContent='';
  document.getElementById('lock-pw').focus();
  isDirty=false;
}

window.addEventListener('beforeunload',e=>{ if(isDirty){e.preventDefault();e.returnValue='';} });

// ── 앱 초기화
async function loadAndShow(){
  show('sc-loading');
  // 익명 인증 대기 (최대 5초, 완료 확인)
  await Promise.race([_authPromise, new Promise(r=>setTimeout(r,5000))]);
  // 인증 토큰 확보 후 요청
  let token = '';
  try{
    const user = _fbAuth.currentUser;
    if(user) token = await user.getIdToken();
  }catch{}
  // ★ shallow=true 로 주차 키만 가져옴
  try{
    const headers = token ? {'Authorization':'Bearer '+token} : {};
    const r=await fetch(fbWeeksShallow(), {headers});
    if(r.ok){ const d=await r.json(); allWeeks=d?Object.keys(d).sort().reverse():[]; }
    else allWeeks=[];
  }catch{ allWeeks=[]; }

  const today=todayKey(), next=nextKey();
  let defKey=today;
  if(allWeeks.includes(next)&&!allWeeks.includes(today)) defKey=next;
  const isNew=!allWeeks.includes(today)&&defKey===today;
  if(!allWeeks.includes(defKey)) allWeeks.unshift(defKey);
  curKey=defKey;

  if(isNew){ await carryOver(); }
  else{ await loadWeek(curKey); }

  buildSel();
  show('sc-app');
  fetchWeather();
}

async function loadWeek(key){
  try{
    const r=await fetch(fbWeek(key));
    if(r.ok){
      const d=await r.json();
      if(d){
        const saved=Array.isArray(d.members)?d.members:[];
        ms=MEMBERS.map((n,i)=>{
          const f=saved.find(m=>m.name===n)||mkM(i+1,n);
          f.id=i+1; f.name=n; return f;
        });
        ceo=d.ceo||'';
        loadedAt=d.updated||null;
      }else{ ms=dfltMs(); ceo=''; loadedAt=null; }
    }else{ ms=dfltMs(); ceo=''; loadedAt=null; }
  }catch{ ms=dfltMs(); ceo=''; loadedAt=null; }
  isDirty=false;
  const el=document.getElementById('ceo-in');
  if(el) el.value=ceo;
  document.getElementById('wk-lbl').textContent=weekLabel(key);
  render();
  setSt('');
}

async function carryOver(){
  const nm=dfltMs();
  const prevKey=[...allWeeks].filter(k=>k!==curKey).sort().reverse()[0];
  let carried=false;
  if(prevKey){
    try{
      const r=await fetch(fbWeek(prevKey));
      if(r.ok){
        const d=await r.json();
        if(d&&Array.isArray(d.members)){
          MEMBERS.forEach((n,i)=>{
            const prev=d.members.find(m=>m.name===n);
            if(prev){ CATS.forEach(c=>{ nm[i]['t_'+c.id]=prev['n_'+c.id]||''; nm[i]['n_'+c.id]=''; }); nm[i].notes=''; carried=true; }
          });
        }
      }
    }catch{}
  }
  ms=nm; ceo=''; isDirty=false; loadedAt=null;
  const payload={members:ms,ceo,updated:new Date().toISOString(),weekLabel:weekLabel(curKey),history:[]};
  await fetch(fbWeek(curKey),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const el=document.getElementById('ceo-in');
  if(el) el.value='';
  document.getElementById('wk-lbl').textContent=weekLabel(curKey);
  render();
  if(carried){ setSt('지난 주 할 일 → 이번 주 한 일로 자동 이동됐어요 ✓'); setTimeout(()=>setSt(''),4000); }
}

// ── 저장
async function doSave(skipConflict=false){
  if(isRO) return;
  collectVals();
  const btn=document.getElementById('save-btn');
  btn.disabled=true; setSt('저장 중...');
  // 충돌 감지
  if(!skipConflict){
    try{
      const r=await fetch(fbWeek(curKey));
      if(r.ok){
        const d=await r.json();
        if(d&&d.updated&&loadedAt&&d.updated>loadedAt){
          btn.disabled=false; setSt('⚠️ 충돌 감지');
          document.getElementById('conflict-box').style.display='block';
          openVer();
          return;
        }
      }
    }catch{}
  }
  document.getElementById('conflict-box').style.display='none';
  // 버전 히스토리 (최근 MAX_H개)
  let history=[];
  try{
    const r=await fetch(fbWeek(curKey));
    if(r.ok){ const d=await r.json(); history=(d&&Array.isArray(d.history))?d.history:[]; }
  }catch{}
  history.unshift({saved:new Date().toISOString(),ceo,members:JSON.parse(JSON.stringify(ms))});
  if(history.length>MAX_H) history=history.slice(0,MAX_H);
  const now=new Date().toISOString();
  try{
    const r=await fetch(fbWeek(curKey),{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({members:ms,ceo,updated:now,weekLabel:weekLabel(curKey),history})});
    if(r.ok){ loadedAt=now; isDirty=false; setSt('저장 완료 ✓'); setTimeout(()=>setSt(''),3000); }
    else setSt('저장 실패');
  }catch{ setSt('오프라인 — 저장 실패'); }
  btn.disabled=isRO;
}

async function forceRefresh(){
  document.getElementById('conflict-box').style.display='none';
  closeVer();
  show('sc-loading');
  await loadWeek(curKey);
  buildSel();
  document.getElementById('week-sel').value=curKey;
  updateUI(curKey);
  show('sc-app');
  setSt('최신 버전으로 새로고침됐어요'); setTimeout(()=>setSt(''),3000);
}

async function doRefresh(){
  if(isDirty&&!confirm('저장하지 않은 내용이 있습니다. 새로고침하면 사라져요. 계속할까요?'))return;
  show('sc-loading');
  await loadWeek(curKey);
  buildSel();
  document.getElementById('week-sel').value=curKey;
  updateUI(curKey);
  show('sc-app');
  setSt('새로고침 완료'); setTimeout(()=>setSt(''),2000);
}

function dirty(){ isDirty=true; setSt('미저장 변경사항 있음'); }
function setSt(s){ const el=document.getElementById('sv-st'); if(el) el.textContent=s; }

function collectVals(){
  const ci=document.getElementById('ceo-in'); if(ci) ceo=ci.value;
  ms.forEach(m=>{
    CATS.forEach(c=>{
      const ta=document.getElementById(`ta_t_${c.id}_${m.id}`); if(ta) m['t_'+c.id]=ta.value;
      const tb=document.getElementById(`ta_n_${c.id}_${m.id}`); if(tb) m['n_'+c.id]=tb.value;
    });
    const tn=document.getElementById(`ta_notes_${m.id}`); if(tn) m.notes=tn.value;
  });
}

// ── 주차 선택기
function buildSel(){
  const sel=document.getElementById('week-sel'); sel.innerHTML='';
  const today=todayKey(), next=nextKey();
  [...new Set(allWeeks)].sort().reverse().forEach(k=>{
    const opt=document.createElement('option'); opt.value=k;
    let lbl=weekLabel(k);
    if(k===today) lbl+=' (이번 주)';
    else if(k===next) lbl+=' (다음 주)';
    opt.textContent=lbl; sel.appendChild(opt);
  });
  sel.value=curKey;
  updateUI(curKey);
}

function updateUI(key){
  const today=todayKey(), next=nextKey();
  isRO=(key!==today&&key!==next);
  const isNext=(key===next&&key!==today);
  const badge=document.getElementById('wbadge');
  const saveBtn=document.getElementById('save-btn');
  if(key===today){ badge.textContent='이번 주'; badge.className='wbadge now'; }
  else if(key===next){ badge.textContent='다음 주'; badge.className='wbadge next'; }
  else{ badge.textContent='과거'; badge.className='wbadge past'; }
  const dow=new Date().getDay();
  const isThuSun=(dow>=4||dow===0);
  const nwBtn=document.getElementById('nw-btn');
  const nwHint=document.getElementById('nw-hint');
  nwBtn.style.display=(isThuSun&&!allWeeks.includes(next)&&key===today)?'flex':'none';
  nwHint.style.display=(isThuSun&&!allWeeks.includes(next)&&key===today)?'block':'none';
  document.getElementById('ban-ro').style.display=isRO?'block':'none';
  document.getElementById('ban-nw').style.display=isNext?'block':'none';
  if(saveBtn) saveBtn.disabled=isRO;
  setTimeout(()=>{ document.querySelectorAll('#pg-input textarea').forEach(el=>el.disabled=isRO); },50);
}

async function onWeekChange(key){
  if(isDirty&&!confirm('저장하지 않은 내용이 있습니다. 이동하시겠어요?')){ document.getElementById('week-sel').value=curKey; return; }
  show('sc-loading'); curKey=key;
  await loadWeek(key); updateUI(key); show('sc-app');
  const active=['input','ceo','history','settings'].find((_,i)=>document.getElementById('t'+(i+1))?.className.includes('on'));
  if(active==='ceo') rCeo();
  if(active==='history') rHist();
}

async function startNextWeek(){
  const next=nextKey();
  if(allWeeks.includes(next)){ document.getElementById('week-sel').value=next; await onWeekChange(next); return; }
  show('sc-loading');
  const nm=dfltMs();
  try{
    const r=await fetch(fbWeek(curKey));
    if(r.ok){
      const d=await r.json();
      if(d&&Array.isArray(d.members)){
        MEMBERS.forEach((n,i)=>{
          const prev=d.members.find(m=>m.name===n);
          if(prev){ CATS.forEach(c=>{ nm[i]['t_'+c.id]=prev['n_'+c.id]||''; nm[i]['n_'+c.id]=''; }); nm[i].notes=''; }
        });
      }
    }
  }catch{}
  curKey=next; ms=nm; ceo=''; isDirty=false;
  allWeeks.unshift(next);
  await fetch(fbWeek(next),{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({members:ms,ceo,updated:new Date().toISOString(),weekLabel:weekLabel(next),history:[]})});
  const ci=document.getElementById('ceo-in'); if(ci) ci.value='';
  document.getElementById('wk-lbl').textContent=weekLabel(next);
  render(); buildSel(); document.getElementById('week-sel').value=next; updateUI(next); show('sc-app');
  setSt('지난 주 할 일 → 이번 주 한 일로 자동 이동됐어요 ✓'); setTimeout(()=>setSt(''),4000);
}

// ── 렌더링
function render(){
  const c=document.getElementById('mc'); c.innerHTML='';
  ms.forEach(m=>{
    const idx=ms.indexOf(m)%4;
    const div=document.createElement('div'); div.className='card';
    let h=`<div class="mhd">
      <div class="av" style="background:${AV_BG[idx]};color:${AV_FG[idx]};">${m.name.charAt(0)}</div>
      <span class="nm">${m.name}</span>
      <div class="dot${hasCont(m)?' on':''}" id="dot-${m.id}"></div>
    </div>`;
    CATS.forEach((cat,ci)=>{
      h+=`<div style="margin-bottom:12px;">
        <div class="sec-row"><span class="sec-n">${cat.num}</span><span class="sec-label">${cat.name}</span></div>
        <div class="col2">
          <div><div class="col-lbl">한 일</div><textarea id="ta_t_${cat.id}_${m.id}" oninput="dirty();updDot(${m.id})" ${isRO?'disabled':''}>${m['t_'+cat.id]}</textarea></div>
          <div><div class="col-lbl">할 일</div><textarea id="ta_n_${cat.id}_${m.id}" oninput="dirty();updDot(${m.id})" ${isRO?'disabled':''}>${m['n_'+cat.id]}</textarea></div>
        </div>
      </div>${ci<CATS.length-1?'<div class="dv"></div>':''}`;
    });
    h+=`<div class="dv"></div>
      <div class="sec-row"><span class="sec-n w">!</span><span class="sec-label w">논의사항</span></div>
      <textarea class="sm" id="ta_notes_${m.id}" oninput="dirty();updDot(${m.id})" ${isRO?'disabled':''}>${m.notes}</textarea>`;
    div.innerHTML=h; c.appendChild(div);
  });
  setTimeout(initResize,50);
}

function updDot(id){
  const f=CATS.some(c=>document.getElementById(`ta_t_${c.id}_${id}`)?.value||document.getElementById(`ta_n_${c.id}_${id}`)?.value)||document.getElementById(`ta_notes_${id}`)?.value;
  const dot=document.getElementById('dot-'+id); if(dot) dot.className='dot'+(f?' on':'');
}

// ── 탭 전환
function sw(tab){
  const map={input:1,ceo:2,history:3,settings:4};
  ['input','ceo','history','settings'].forEach(t=>{
    document.getElementById('pg-'+t).style.display=t===tab?'block':'none';
    document.getElementById('t'+map[t]).className='tab'+(t===tab?' on':'');
  });
  if(tab==='ceo'){ collectVals(); rCeo(); }
  if(tab==='history') rHist();
}

// ── 대표님 뷰
function rCeo(){
  const ceo_vw=document.getElementById('ceo-vw');
  const ceo_vt=document.getElementById('ceo-vt');
  if(ceo.trim()){ ceo_vw.style.display='block'; ceo_vt.textContent=ceo; }
  else ceo_vw.style.display='none';
  const lw=document.getElementById('lead-wrap'); lw.innerHTML='';
  const lead=ms.find(m=>m.name===LEAD);
  if(lead){
    const d=document.createElement('div'); d.className='lead-card';
    let h=`<div class="lead-name">${lead.name}<span class="lead-badge">팀장</span></div>`;
    CATS.forEach(cat=>{
      const tw=lead['t_'+cat.id],nw=lead['n_'+cat.id]; if(!tw&&!nw)return;
      h+=`<div style="margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:7px;"><span class="sec-n">${cat.num}</span><span class="sec-label">${cat.name}</span></div>
        <div class="lead-grid">
          <div><div class="lead-lbl">한 일</div><div class="lead-val">${tw||'—'}</div></div>
          <div><div class="lead-lbl">할 일</div><div class="lead-val">${nw||'—'}</div></div>
        </div>
      </div>`;
    });
    if(lead.notes) h+=`<div style="padding-top:10px;border-top:.5px solid var(--border);"><span class="tag-w">논의사항</span><div class="lead-val" style="margin-top:6px;font-size:13px;">${lead.notes}</div></div>`;
    if(!hasCont(lead)) h+=`<div class="eh">아직 입력된 내용이 없습니다</div>`;
    d.innerHTML=h; lw.appendChild(d);
  }
  const tw=document.getElementById('team-wrap'); tw.innerHTML='';
  const to=document.getElementById('team-outer');
  const teamMs=ms.filter(m=>m.name!==LEAD);
  to.style.display=teamMs.some(hasCont)?'block':'none';
  teamMs.forEach(m=>{
    if(!hasCont(m))return;
    const d=document.createElement('div'); d.className='team-card';
    let h=`<div class="team-name">${m.name}</div>`;
    CATS.forEach(cat=>{
      const tv=m['t_'+cat.id],nv=m['n_'+cat.id]; if(!tv&&!nv)return;
      h+=`<div style="margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;"><span class="sec-n" style="font-size:10px;padding:1px 5px;">${cat.num}</span><span style="font-size:10px;font-weight:600;color:var(--text3);">${cat.name}</span></div>
        <div class="team-grid">
          <div><div class="team-lbl">한 일</div><div class="team-val">${tv||'—'}</div></div>
          <div><div class="team-lbl">할 일</div><div class="team-val">${nv||'—'}</div></div>
        </div>
      </div>`;
    });
    if(m.notes) h+=`<div style="padding-top:6px;border-top:.5px solid var(--border);margin-top:4px;"><span class="tag-w">논의사항</span><div class="team-val" style="margin-top:3px;">${m.notes}</div></div>`;
    d.innerHTML=h; tw.appendChild(d);
  });
}

// ── 히스토리 탭 (allWeeks 직접 사용 — 추가 Firebase 요청 없음)
function rHist(){
  const c=document.getElementById('hw-list'); c.innerHTML='';
  const keys=[...new Set(allWeeks)].sort().reverse();
  if(!keys.length){ c.innerHTML='<div class="eh" style="padding:8px 0;">아직 기록된 주차가 없습니다</div>'; return; }
  const today=todayKey(), next=nextKey();
  keys.forEach(k=>{
    const div=document.createElement('div'); div.className='hw-card';
    div.onclick=()=>{ document.getElementById('week-sel').value=k; onWeekChange(k); sw('input'); };
    let tag='';
    if(k===today) tag='<span class="wbadge now" style="font-size:10px;">이번 주</span>';
    else if(k===next) tag='<span class="wbadge next" style="font-size:10px;">다음 주</span>';
    div.innerHTML=`<div>
      <div style="font-size:14px;font-weight:600;">${weekLabel(k)}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:3px;">${k===curKey?'지금 보고 있는 주차':'클릭해서 열기'}</div>
    </div>${tag}`;
    c.appendChild(div);
  });
}

// ── 버전 히스토리 패널
function openVer(){ document.getElementById('ver-panel').classList.add('open'); document.getElementById('ver-overlay').classList.add('open'); loadVerList(); }
function closeVer(){ document.getElementById('ver-panel').classList.remove('open'); document.getElementById('ver-overlay').classList.remove('open'); }

async function loadVerList(){
  const list=document.getElementById('ver-list'); list.innerHTML='<div class="eh">불러오는 중...</div>';
  try{
    const r=await fetch(fbWeek(curKey));
    if(!r.ok){ list.innerHTML='<div class="eh">기록을 불러올 수 없어요.</div>'; return; }
    const d=await r.json();
    const history=d&&Array.isArray(d.history)?d.history:[];
    if(!history.length){ list.innerHTML='<div class="eh">아직 저장 기록이 없어요.</div>'; return; }
    list.innerHTML='';
    history.forEach((v,i)=>{
      const dt=new Date(v.saved);
      const lbl=dt.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})+' '+dt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      const ago=timeAgo(dt);
      const item=document.createElement('div'); item.className='ver-item';
      item.innerHTML=`<div class="ver-time">${i===0?'🔵 최신 · ':''} ${lbl}</div>
        <div class="ver-ago">${ago}</div>
        ${i>0?`<button class="ver-btn" onclick="restoreVer(${i})">이 버전으로 복원</button>`:'<div style="font-size:11px;color:var(--text3);">현재 저장된 버전</div>'}`;
      list.appendChild(item);
    });

async function restoreVer(idx){
  if(!confirm('이 버전으로 복원할까요?'))return;
  try{
    const r=await fetch(fbWeek(curKey)); if(!r.ok)return;
    const d=await r.json();
    const history=d&&Array.isArray(d.history)?d.history:[];
    const v=history[idx]; if(!v)return;
    const saved=Array.isArray(v.members)?v.members:[];
    ms=MEMBERS.map((n,i)=>{ const f=saved.find(m=>m.name===n)||mkM(i+1,n); f.id=i+1; f.name=n; return f; });
    ceo=v.ceo||'';
    const el=document.getElementById('ceo-in'); if(el) el.value=ceo;
    render(); closeVer(); isDirty=true; setSt('복원됐어요. 저장 버튼을 눌러 확정해주세요.');
  }catch{ alert('복원에 실패했어요.'); }
}

function timeAgo(date){
  const diff=Math.floor((Date.now()-date)/1000);
  if(diff<60)return `${diff}초 전`;
  if(diff<3600)return `${Math.floor(diff/60)}분 전`;
  if(diff<86400)return `${Math.floor(diff/3600)}시간 전`;
  return `${Math.floor(diff/86400)}일 전`;
}

// ── 복사
function cpAll(btn){
  collectVals();
  let t=`📋 ${weekLabel(curKey)} 인사팀 위클리 보고\n\n`;
  if(ceo.trim()) t+=`[대표님 지시/요청사항]\n${ceo}\n\n`;
  ms.forEach(m=>{
    t+=`▪ ${m.name}\n`;
    CATS.forEach(c=>{ t+=`${c.num}. ${c.name}\n  한 일: ${m['t_'+c.id]||'없음'}\n  할 일: ${m['n_'+c.id]||'없음'}\n`; });
    if(m.notes) t+=`▶ 논의사항: ${m.notes}\n`;
    t+='\n';
  });
  navigator.clipboard.writeText(t).then(()=>{ const o=btn.textContent; btn.textContent='복사됨!'; setTimeout(()=>btn.textContent=o,1500); });
}

// ── 설정 (비밀번호 변경)
async function changePw(){
  const p1=document.getElementById('npw1').value, p2=document.getElementById('npw2').value;
  const msg=document.getElementById('pw-msg');
  if(!p1||p1.length<4){ msg.style.color='var(--red)'; msg.textContent='4자 이상 입력해주세요.'; return; }
  if(p1!==p2){ msg.style.color='var(--red)'; msg.textContent='비밀번호가 일치하지 않습니다.'; return; }
  msg.style.color='var(--text2)'; msg.textContent='변경 중...';
  try{
    const h=await sha256(p1);
    const r=await fetch(fbAuth(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hash:h})});
    msg.style.color=r.ok?'var(--green)':'var(--red)';
    msg.textContent=r.ok?'변경 완료! 새 비밀번호를 팀원들에게 알려주세요.':'저장 실패.';
  }catch{ msg.style.color='var(--red)'; msg.textContent='오류가 발생했습니다.'; }
  document.getElementById('npw1').value=''; document.getElementById('npw2').value='';
}

// ── 날씨
function getSeason(m){ if(m>=3&&m<=5)return'spring'; if(m>=6&&m<=8)return'summer'; if(m>=9&&m<=11)return'autumn'; return'winter'; }
function getCond(code){ if(code<=1)return'clear'; if(code<=3)return'cloudy'; if(code<=48)return'fog'; if(code<=82)return'rain'; if(code<=86)return'snow'; if(code>=95)return'thunder'; return'cloudy'; }
const WX_EMOJI={clear:'☀️',cloudy:'☁️',fog:'🌫️',rain:'🌧️',snow:'🌨️',thunder:'⛈️'};

async function fetchWeather(){
  const now=new Date();
  const days=['일','월','화','수','목','금','토'];
  const dateEl=document.getElementById('wx-date');
  const emEl=document.getElementById('wx-em');
  const tmpEl=document.getElementById('wx-temp');
  if(dateEl) dateEl.textContent=`${now.getMonth()+1}/${now.getDate()} (${days[now.getDay()]})`;
  const season=getSeason(now.getMonth()+1);
  applyBg('clear',season);
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&timezone=Asia%2FSeoul');
    if(!r.ok) throw new Error();
    const d=await r.json();
    const temp=Math.round(d.current.temperature_2m);
    const cond=getCond(d.current.weather_code);
    if(emEl) emEl.textContent=WX_EMOJI[cond]||'☀️';
    if(tmpEl) tmpEl.textContent=`${temp}°C`;
    applyBg(cond,season);
  }catch{
    if(emEl) emEl.textContent=WX_EMOJI.clear;
    if(tmpEl) tmpEl.textContent='';
  }
}

function applyBg(cond,season){
  const bg=document.getElementById('wx-bg'); if(!bg)return;
  bg.innerHTML='';
  const theme=['rain','snow','fog','cloudy','thunder'].includes(cond)?cond:season;
  const grads={
    spring:'radial-gradient(ellipse at 78% 2%,#f0d0e4 0%,#eae0f2 45%,#e4eaf8 100%)',
    summer:'radial-gradient(ellipse at 78% 2%,#90ccf4 0%,#b8e0f8 50%,#daf0ff 100%)',
    autumn:'radial-gradient(ellipse at 78% 2%,#f0c068 0%,#f5d898 50%,#f8edd8 100%)',
    winter:'radial-gradient(ellipse at 78% 2%,#98c4e8 0%,#c0d8f0 50%,#e4f0fc 100%)',
    rain:'linear-gradient(150deg,#a8b8cc 0%,#c0ccd8 55%,#d4dce6 100%)',
    snow:'radial-gradient(ellipse at 50% 0%,#a8c4e0 0%,#c8daf0 55%,#e4eef8 100%)',
    fog:'linear-gradient(180deg,#b4b8c4 0%,#c4c8d2 55%,#d4d8e0 100%)',
    cloudy:'linear-gradient(150deg,#b0b4c8 0%,#c4c8d8 55%,#d4d8e8 100%)',
    thunder:'linear-gradient(150deg,#8878a8 0%,#a098bc 55%,#bcb4d0 100%)',
  };
  bg.style.cssText=`position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background:${grads[theme]||grads.spring};`;
  // 날씨 아이콘 (우상단)
  addSkyIcon(bg,cond);

  addTrees(bg,season);

  addWxExtra(bg,cond);
}
