<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사팀 위클리 보고</title>
<script>
const FIREBASE_URL = 'https://sirloinhr-default-rtdb.asia-southeast1.firebasedatabase.app';
const FIXED_MEMBERS = ['류효인', '허원희', '김명진'];
const LEAD_NAME = '류효인';
const MAX_HIST = 10;
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#f0efe9;
  --text:#1a1a18;--text2:#6b6a65;--text3:#9c9a92;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --green:#1D9E75;--red:#A32D2D;--blue:#185FA5;
  --blue-bg:#E6F1FB;--green-bg:#EAF3DE;--amber-bg:#FAEEDA;--coral-bg:#FAECE7;
  --blue-t:#185FA5;--green-t:#3B6D11;--amber-t:#854F0B;--coral-t:#993C1D;
  --warn-bg:#FAEEDA;--warn-bd:#EF9F27;--warn-t:#633806;
  --r:8px;--rl:12px;
  --bg3-override:#f0efe9;
}
html,body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg3-override);color:var(--text);min-height:100vh;transition:background 1.2s ease;}
/* ── WEATHER BACKGROUND ── */
#wx-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;transition:opacity 1s ease;}
.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px 60px;}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;position:relative;z-index:1;}
.ptcl{position:absolute;pointer-events:none;animation:ptclFall linear infinite;}
@keyframes ptclFall{0%{transform:translateY(-40px) translateX(0px) rotate(0deg);opacity:1;}
  50%{transform:translateY(50vh) translateX(var(--sx,15px)) rotate(180deg);opacity:.8;}
  100%{transform:translateY(110vh) translateX(0px) rotate(360deg);opacity:0;}}
@keyframes ptclRain{0%{transform:translateY(-20px) skewX(-15deg);opacity:.7;}
  100%{transform:translateY(110vh) skewX(-15deg);opacity:.3;}}
@keyframes ptclFloat{0%,100%{transform:translateY(0) scaleX(1);}50%{transform:translateY(-8px) scaleX(1.1);}}
/* ── WEATHER STRIP ── */
.wx-strip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--rl);background:rgba(255,255,255,0.6);backdrop-filter:blur(8px);border:0.5px solid rgba(255,255,255,0.8);flex-shrink:0;}
.wx-emoji{font-size:20px;line-height:1;}
.wx-info{display:flex;flex-direction:column;gap:1px;}
.wx-temp{font-size:14px;font-weight:700;color:var(--text);}
.wx-date{font-size:10px;color:var(--text2);}
/* ── AUTH ── */
.auth-logo{font-size:11px;font-weight:600;letter-spacing:0.18em;color:var(--text3);margin-bottom:28px;text-transform:uppercase;}
.auth-card{background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border:0.5px solid rgba(255,255,255,0.9);border-radius:var(--rl);padding:28px 24px;width:100%;max-width:360px;}
.auth-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6;}
.field-lbl{font-size:11px;color:var(--text2);margin-bottom:5px;}
.field-inp{width:100%;font-size:14px;font-family:inherit;border:0.5px solid var(--border2);border-radius:var(--r);padding:9px 12px;background:var(--bg2);color:var(--text);margin-bottom:6px;}
.field-inp:focus{outline:none;border-color:var(--text3);background:var(--bg);}
.auth-btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:var(--r);padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;}
.auth-btn:hover{opacity:0.85;}
.auth-btn:disabled{opacity:0.38;cursor:not-allowed;}
.auth-err{font-size:12px;color:var(--red);min-height:18px;}
.auth-note{font-size:11px;color:var(--text3);margin-top:16px;padding-top:14px;border-top:0.5px solid var(--border);line-height:1.65;}
/* ── WEEK BAR ── */
.week-bar{background:rgba(255,255,255,0.7);backdrop-filter:blur(8px);border:0.5px solid rgba(255,255,255,0.9);border-radius:var(--rl);padding:10px 14px;margin-bottom:10px;}
.week-bar-top{display:flex;align-items:center;gap:8px;}
.week-bar select{flex:1;font-size:13px;font-family:inherit;background:none;border:none;color:var(--text);cursor:pointer;outline:none;}
.wbadge{font-size:11px;border-radius:4px;padding:2px 8px;font-weight:600;flex-shrink:0;}
.wbadge.now{background:var(--green-bg);color:var(--green-t);}
.wbadge.next{background:var(--blue-bg);color:var(--blue-t);}
.wbadge.past{background:var(--bg2);color:var(--text2);}
.nw-btn{font-size:12px;background:var(--blue-t);color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit;font-weight:600;flex-shrink:0;white-space:nowrap;}
.nw-btn:hover{opacity:0.85;}
.wk-hint{font-size:11px;color:var(--blue-t);margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border);display:none;}
/* ── BANNERS ── */
.banner{border-radius:var(--r);padding:10px 14px;font-size:12px;margin-bottom:12px;display:none;}
.banner.readonly{background:var(--amber-bg);border:0.5px solid var(--warn-bd);color:var(--amber-t);}
.banner.nextweek{background:var(--blue-bg);border:0.5px solid var(--blue-t);color:var(--blue-t);}
/* ── APP HEADER ── */
.app-header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 0 12px;gap:12px;}
.app-title{font-size:18px;font-weight:700;}
.app-sub{font-size:12px;color:var(--text2);margin-top:3px;}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0;}
.save-st{font-size:11px;color:var(--text3);}
.icon-btn{background:rgba(255,255,255,0.7);backdrop-filter:blur(4px);border:0.5px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text2);cursor:pointer;font-family:inherit;}
.icon-btn:hover{background:var(--bg2);}
.save-btn{background:var(--text);color:var(--bg);border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.save-btn:hover{opacity:0.85;}
.save-btn:disabled{opacity:0.38;cursor:not-allowed;}
.refresh-btn{background:rgba(255,255,255,0.7);border:0.5px solid var(--border2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;}
.refresh-btn:hover{background:var(--bg2);}
.hist-btn{background:rgba(255,255,255,0.7);border:0.5px solid var(--border2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;}
.hist-btn:hover{background:var(--bg2);}
/* ── TABS ── */
.tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:20px;}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 16px;font-size:14px;color:var(--text2);cursor:pointer;font-family:inherit;margin-bottom:-1px;}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--text);}
/* ── CARDS ── */
.card{background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border:0.5px solid rgba(255,255,255,0.9);border-radius:var(--rl);padding:18px;margin-bottom:12px;}
.warn-card{border-color:var(--warn-bd);}
.member-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.name-label{flex:1;font-size:15px;font-weight:600;color:var(--text);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0;}
.dot.on{background:var(--green);}
.sec-row{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.sec-badge{font-size:11px;font-weight:600;background:var(--bg2);border:0.5px solid var(--border);border-radius:5px;padding:2px 7px;flex-shrink:0;}
.sec-name{font-size:12px;font-weight:600;color:var(--text2);}
.warn-badge{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-t);}
.warn-name{color:var(--warn-t);}
.col-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.col-lbl{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:600;}
textarea{width:100%;font-size:13px;font-family:inherit;border:0.5px solid var(--border);border-radius:var(--r);padding:9px 11px;background:rgba(247,246,243,0.8);color:var(--text);resize:none;min-height:110px;line-height:1.75;overflow:hidden;}
textarea:focus{outline:none;border-color:var(--border2);background:var(--bg);}
textarea:disabled{opacity:0.6;cursor:not-allowed;}
textarea.warn{border-color:var(--warn-bd);min-height:90px;}
textarea.sm{min-height:90px;}
.dv{height:0.5px;background:var(--border);margin:14px 0;}
.row-end{display:flex;justify-content:flex-end;margin-top:16px;gap:8px;}
.btn-p{background:var(--text);color:var(--bg);border:none;border-radius:var(--r);padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-p:hover{opacity:0.85;}
.btn-s{background:rgba(255,255,255,0.7);border:0.5px solid var(--border2);border-radius:var(--r);padding:7px 14px;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;}
.btn-s:hover{background:var(--bg2);}
/* ── CEO VIEW ── */
.sec-lbl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:10px;}
.lead-card{background:rgba(255,255,255,0.9);border:1.5px solid var(--text);border-radius:var(--rl);padding:20px;margin-bottom:16px;}
.lead-name{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.lead-badge{font-size:10px;background:var(--text);color:var(--bg);border-radius:4px;padding:2px 7px;font-weight:700;}
.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
.lead-lbl{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.lead-val{font-size:13px;line-height:1.65;white-space:pre-wrap;}
.team-section-lbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;margin-top:4px;}
.team-card{background:rgba(247,246,243,0.8);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;}
.team-name{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.team-lbl{font-size:10px;font-weight:600;color:var(--text3);margin-bottom:2px;}
.team-val{font-size:11px;line-height:1.55;white-space:pre-wrap;color:var(--text2);}
.tag-w{display:inline-block;font-size:10px;background:var(--coral-bg);color:var(--coral-t);border-radius:4px;padding:1px 6px;margin-top:3px;}
.eh{color:var(--text3);font-size:13px;font-style:italic;}
/* ── HISTORY TAB ── */
.hw-card{background:rgba(255,255,255,0.85);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 18px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.hw-card:hover{border-color:var(--border2);}
/* ── VERSION HISTORY PANEL ── */
.ver-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.25);z-index:200;display:none;}
.ver-overlay.open{display:block;}
.ver-panel{position:fixed;top:0;right:0;height:100vh;width:300px;background:var(--bg);border-left:0.5px solid var(--border);z-index:201;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;display:flex;flex-direction:column;}
.ver-panel.open{transform:translateX(0);}
.ver-header{padding:20px 18px 14px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.ver-title{font-size:15px;font-weight:700;}
.ver-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);padding:0;line-height:1;}
.ver-body{padding:14px 18px;flex:1;overflow-y:auto;}
.ver-item{padding:12px 14px;border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;}
.ver-time{font-size:13px;font-weight:600;margin-bottom:2px;}
.ver-ago{font-size:11px;color:var(--text3);margin-bottom:8px;}
.ver-restore{font-size:12px;background:none;border:0.5px solid var(--border2);border-radius:5px;padding:4px 10px;cursor:pointer;font-family:inherit;color:var(--text2);}
.ver-restore:hover{background:var(--bg2);}
.ver-empty{font-size:13px;color:var(--text3);font-style:italic;padding:8px 0;}
.ver-conflict{background:var(--amber-bg);border:0.5px solid var(--warn-bd);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--amber-t);display:none;}
/* ── SETTINGS ── */
.sr{display:flex;gap:8px;margin-top:10px;}
.sr input{flex:1;font-size:13px;font-family:inherit;border:0.5px solid var(--border2);border-radius:var(--r);padding:7px 10px;background:var(--bg2);color:var(--text);}
.sr input:focus{outline:none;border-color:var(--text3);}
.sm2{font-size:11px;margin-top:4px;min-height:16px;}
/* ── LOADING ── */
.ld{display:flex;gap:5px;align-items:center;padding:4px 0;}
.ldd{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:pulse 1.1s infinite;}
.ldd:nth-child(2){animation-delay:.18s;}
.ldd:nth-child(3){animation-delay:.36s;}
@keyframes pulse{0%,80%,100%{transform:scale(.55)}40%{transform:scale(1)}}

.wx-strip{display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:var(--border-radius-lg,10px);background:rgba(255,255,255,0.55);backdrop-filter:blur(8px);border:0.5px solid rgba(255,255,255,0.8);flex-shrink:0;}
.wx-emoji{font-size:18px;line-height:1;}
.wx-temp{font-size:14px;font-weight:700;color:var(--color-text-primary,#1a1a18);}
.wx-date{font-size:10px;color:var(--color-text-secondary,#6b6a65);}
</style>
</head>
<body>

<!-- 날씨 배경 레이어 -->
<div id="wx-bg"></div>

<!-- LOCK -->
<div id="sc-lock" class="center" style="display:none;">
  <div class="auth-logo">HR Weekly</div>
  <div class="auth-card">
    <div class="auth-title">비밀번호 입력</div>
    <div class="auth-sub">인사팀 위클리 보고 시스템입니다.</div>
    <div class="field-lbl">비밀번호</div>
    <input class="field-inp" type="password" id="lock-pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')unlock();" autocomplete="current-password"/>
    <div class="auth-err" id="lock-err"></div>
    <button class="auth-btn" id="unlock-btn" onclick="unlock()">입장하기</button>
    <div class="auth-note">이 링크와 비밀번호는 팀 내부에서만 공유해주세요.</div>
  </div>
</div>

<!-- LOADING -->
<div id="sc-loading" class="center" style="display:none;">
  <div class="ld"><div class="ldd"></div><div class="ldd"></div><div class="ldd"></div></div>
  <div style="font-size:13px;color:var(--text2);margin-top:12px;">불러오는 중...</div>
</div>

<!-- VERSION HISTORY PANEL -->
<div class="ver-overlay" id="ver-overlay" onclick="closeVerPanel()"></div>
<div class="ver-panel" id="ver-panel">
  <div class="ver-header">
    <div class="ver-title">⏱ 저장 기록</div>
    <button class="ver-close" onclick="closeVerPanel()">×</button>
  </div>
  <div class="ver-body">
    <div class="ver-conflict" id="ver-conflict">
      ⚠️ 다른 사람이 저장한 내용이 있어요.<br>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="ver-restore" onclick="forceRefresh()" style="background:var(--amber-bg);border-color:var(--warn-bd);color:var(--amber-t);">최신 버전 불러오기</button>
        <button class="ver-restore" onclick="closeVerPanel()">무시하고 계속</button>
      </div>
    </div>
    <div id="ver-list"></div>
  </div>
</div>

<!-- APP -->
<div id="sc-app" style="display:none;">
  <div class="page">
    <div class="app-header">
      <div>
        <div class="app-title">인사팀 위클리 보고</div>
        <div class="app-sub" id="wk-lbl"></div>
      </div>
      <div class="header-right">
        <div class="wx-strip" id="wx-strip">
          <div class="wx-emoji" id="wx-emoji">—</div>
          <div class="wx-info">
            <div class="wx-temp" id="wx-temp">—°C</div>
            <div class="wx-date" id="wx-date"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 저장/새로고침/기록 버튼 -->
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <span class="save-st" id="sv-st" style="flex:1;"></span>
      <button class="hist-btn" onclick="openVerPanel()">⏱ 저장 기록</button>
      <button class="refresh-btn" onclick="doRefresh()">↻ 새로고침</button>
      <button class="save-btn" id="save-btn" onclick="doSave()">저장</button>
      <button class="icon-btn" onclick="doLock()">잠금</button>
    </div>

    <!-- 주차 선택 바 -->
    <div class="week-bar">
      <div class="week-bar-top">
        <select id="week-sel" onchange="onWeekChange(this.value)"></select>
        <span class="wbadge" id="wbadge">이번 주</span>
        <button class="nw-btn" id="nw-btn" onclick="startNextWeek()" style="display:none;">다음 주 미리 작성</button>
      </div>
      <div class="wk-hint" id="wk-hint">목~일요일에 다음 주 보고서를 미리 작성할 수 있어요.</div>
    </div>

    <div class="banner readonly" id="ban-readonly">과거 주차는 읽기 전용입니다.</div>
    <div class="banner nextweek" id="ban-next">다음 주 보고서를 미리 작성 중이에요.</div>

    <div class="tabs">
      <button class="tab on" id="t1" onclick="sw('input')">팀원 입력</button>
      <button class="tab" id="t2" onclick="sw('ceo')">대표님 뷰</button>
      <button class="tab" id="t3" onclick="sw('history')">히스토리</button>
      <button class="tab" id="t4" onclick="sw('settings')">설정</button>
    </div>

    <!-- INPUT TAB -->
    <div id="pg-input">
      <div class="card warn-card">
        <div class="sec-row" style="margin-bottom:8px;">
          <span class="sec-badge warn-badge">★</span>
          <span class="sec-name warn-name">대표님 지시 / 요청사항</span>
        </div>
        <textarea class="warn" id="ceo-in" placeholder="이번 주 위클리에서 받은 지시·요청사항..." oninput="markDirty()"></textarea>
      </div>
      <div id="mc"></div>
      <div class="row-end">
        <button class="btn-s" onclick="doSave()">저장</button>
        <button class="btn-p" onclick="saveAndCeo()">저장하고 대표님 뷰로 →</button>
      </div>
    </div>

    <!-- CEO TAB -->
    <div id="pg-ceo" style="display:none;">
      <div id="ceo-vw" style="margin-bottom:16px;display:none;">
        <div class="sec-lbl">대표님 지시 / 요청사항</div>
        <div style="background:var(--warn-bg);border:0.5px solid var(--warn-bd);border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.7;" id="ceo-vt"></div>
      </div>
      <div class="sec-lbl">이번 주 보고</div>
      <div id="lead-wrap"></div>
      <div id="team-outer" style="display:none;">
        <div class="team-section-lbl">팀원 보고</div>
        <div id="team-wrap"></div>
      </div>
      <div class="dv"></div>
      <div><div style="display:flex;justify-content:flex-end;"><button class="btn-s" onclick="cpAll(this)">전체 보고서 복사</button></div></div>
    </div>

    <!-- HISTORY TAB -->
    <div id="pg-history" style="display:none;">
      <div class="sec-lbl">주차별 기록</div>
      <div id="hw-list"></div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="pg-settings" style="display:none;">
      <div class="card">

function getSeason(m){if(m>=3&&m<=5)return'spring';if(m>=6&&m<=8)return'summer';if(m>=9&&m<=11)return'autumn';return'winter';}
function getCondition(code){
  if(code<=1)return'clear';if(code<=3)return'cloudy';
  if(code<=48)return'fog';if(code<=67||code<=82)return'rain';
  if(code<=77||code<=86)return'snow';if(code>=95)return'thunder';
  return'cloudy';
}

async function fetchWeather(){
  const now=new Date();
  const days=['일','월','화','수','목','금','토'];
  const el=document.getElementById('wx-date');
  if(el)el.textContent=`${now.getMonth()+1}/${now.getDate()} (${days[now.getDay()]})`;
  const season=getSeason(now.getMonth()+1);
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&timezone=Asia/Seoul');
    if(!r.ok)throw new Error();
    const d=await r.json();
    const temp=Math.round(d.current.temperature_2m);
    const cond=getCondition(d.current.weather_code);
    const emojiKey=cond==='clear'?`clear_${season}`:cond;
    const ee=document.getElementById('wx-emoji');
    const et=document.getElementById('wx-temp');
    if(ee)ee.textContent=WX_EMOJI[emojiKey]||'🌤️';
    if(et)et.textContent=`${temp}°C`;
    applyWeatherBg(cond,season);
  }catch{
    applyWeatherBg('clear',season);
  }
}

async function sha256(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+'_wk25'));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch{return btoa(s+'_wk25');}
}
function show(id){
  ['sc-lock','sc-loading','sc-app'].forEach(s=>{
    document.getElementById(s).style.display=s===id?'block':'none';
  });
}
function getApiKey(){
  return(typeof ANTHROPIC_KEY!=='undefined'&&ANTHROPIC_KEY)?ANTHROPIC_KEY:(localStorage.getItem('wk_api_key')||'');
}
async function unlock(){
  const pw=document.getElementById('lock-pw').value;
  const err=document.getElementById('lock-err');
  const btn=document.getElementById('unlock-btn');
  if(!pw){err.textContent='비밀번호를 입력해주세요.';return;}
  btn.disabled=true;btn.textContent='확인 중...';err.textContent='';
  let ok=false;
  try{const r=await fetch(authPath());if(r.ok){const d=await r.json();if(d&&d.hash){const h=await sha256(pw);ok=(h===d.hash);}}}catch{}
  if(!ok)ok=_ck(pw);
  if(ok){await loadAndShow();}
  else{err.textContent='비밀번호가 올바르지 않습니다.';document.getElementById('lock-pw').value='';document.getElementById('lock-pw').focus();}
  btn.disabled=false;btn.textContent='입장하기';
}

// WEEK KEY UTILS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function getWeekKey(offset){
  const d=new Date();if(offset)d.setDate(d.getDate()+offset*7);
  const day=d.getDay()||7;const mon=new Date(d);mon.setDate(d.getDate()-day+1);
  const yr=mon.getFullYear();const jan1=new Date(yr,0,1);
  const wn=Math.ceil(((mon-jan1)/86400000+(jan1.getDay()||7)-1)/7)+1;
  return `${yr}_W${String(wn).padStart(2,'0')}`;
}
function getNextWeekKey(){return getWeekKey(1);}
function thisWeekKey(){return getWeekKey(0);}

function weekKeyToLabel(key){
  const [yr,wPart]=key.split('_');const wn=parseInt(wPart.replace('W',''));
  const jan1=new Date(parseInt(yr),0,1);const firstMon=new Date(jan1);
  firstMon.setDate(jan1.getDate()+((8-(jan1.getDay()||7))%7||7)-7);
  const mon=new Date(firstMon);mon.setDate(firstMon.getDate()+(wn-1)*7);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const f=x=>`${x.getMonth()+1}/${x.getDate()}`;
  return `${mon.getFullYear()}년 ${mon.getMonth()+1}월 ${Math.ceil(mon.getDate()/7)}주차 (${f(mon)} ~ ${f(fri)})`;
}

  });
}
function mkM(id,name){const m={id,name};CATS.forEach(c=>{m[`t_${c.id}`]='';m[`n_${c.id}`]='';});m.notes='';return m;}
function hasCont(m){return CATS.some(c=>m[`t_${c.id}`]||m[`n_${c.id}`])||m.notes;}

async function loadAndShow(){
  show('sc-loading');
  const today=thisWeekKey(),next=getNextWeekKey();
  try{const r=await fetch(weeksPath());if(r.ok){const d=await r.json();allWeeks=d?Object.keys(d).sort().reverse():[]; }}catch{allWeeks=[];}
  let defaultKey=today;
  if(allWeeks.includes(next)&&!allWeeks.includes(today))defaultKey=next;
  const isNew=!allWeeks.includes(today)&&defaultKey===today;
  if(!allWeeks.includes(defaultKey))allWeeks.unshift(defaultKey);
  curKey=defaultKey;
  if(isNew){await carryOverFromLastWeek();}
  else{await loadWeek(curKey);}
  buildSelector();
  show('sc-app');
}

async function loadWeek(key){
  try{
    const r=await fetch(dbPath(key));
    if(r.ok){
      const d=await r.json();
      if(d){
        const saved=d.members||[];
        ms=FIXED_MEMBERS.map((name,i)=>{
          const found=saved.find(m=>m.name===name)||mkM(i+1,name);
          found.id=i+1;found.name=name;return found;
        });
        ceo=d.ceo||'';
        loadedAt=d.updated||null;
      }else{ms=dfltMs();ceo='';loadedAt=null;}
    }else{ms=dfltMs();ceo='';loadedAt=null;}
  }catch{ms=dfltMs();ceo='';loadedAt=null;}
  isDirty=false;
  document.getElementById('ceo-in').value=ceo;
  document.getElementById('wk-lbl').textContent=weekKeyToLabel(key);
  render();setSt('');
}

async function carryOverFromLastWeek(){
  const newMs=dfltMs();
  const prevKey=[...allWeeks].filter(k=>k!==curKey).sort().reverse()[0];
  let carried=false;
  if(prevKey){
    try{
      const r=await fetch(dbPath(prevKey));
      if(r.ok){const d=await r.json();
        if(d&&d.members){
          FIXED_MEMBERS.forEach((name,i)=>{
            const prev=d.members.find(m=>m.name===name);
            if(prev){CATS.forEach(cat=>{newMs[i][`t_${cat.id}`]=prev[`n_${cat.id}`]||'';newMs[i][`n_${cat.id}`]='';});newMs[i].notes='';carried=true;}
          });
        }
      }
    }catch{}
  }
  ms=newMs;ceo='';isDirty=false;loadedAt=null;
  await fetch(dbPath(curKey),{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({members:ms,ceo,updated:new Date().toISOString(),weekLabel:weekKeyToLabel(curKey),history:[]})});
  document.getElementById('ceo-in').value='';
  document.getElementById('wk-lbl').textContent=weekKeyToLabel(curKey);
  render();
  if(carried){setSt('지난 주 할 일 → 이번 주 한 일로 자동 이동됐어요 ✓');setTimeout(()=>setSt(''),4000);}
}

// 저장 (충돌 감지 포함)
async function doSave(skipConflict){
  if(isRO)return;
  collectValues();
  const btn=document.getElementById('save-btn');
  btn.disabled=true;setSt('저장 중...');
  // 충돌 감지
  if(!skipConflict){
    try{
      const r=await fetch(dbPath(curKey));
      if(r.ok){
        const d=await r.json();
        if(d&&d.updated&&loadedAt&&d.updated>loadedAt){
          btn.disabled=false;setSt('⚠️ 충돌 감지');
          document.getElementById('ver-conflict').style.display='block';
          openVerPanel();
          return;
        }
      }
    }catch{}
  }
  document.getElementById('ver-conflict').style.display='none';
  // 버전 히스토리 관리
  let history=[];
  try{
    const r=await fetch(dbPath(curKey));
    if(r.ok){const d=await r.json();history=(d&&d.history)||[];}
  }catch{}
  history.unshift({saved:new Date().toISOString(),ceo,members:JSON.parse(JSON.stringify(ms))});
  if(history.length>MAX_HIST)history=history.slice(0,MAX_HIST);
  const now=new Date().toISOString();
  try{
    const r=await fetch(dbPath(curKey),{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({members:ms,ceo,updated:now,weekLabel:weekKeyToLabel(curKey),history})});
    if(r.ok){loadedAt=now;isDirty=false;setSt('저장 완료 ✓');setTimeout(()=>setSt(''),3000);}
    else setSt('저장 실패');
  }catch{setSt('오프라인 — 저장 실패');}
  btn.disabled=isRO;
}

function buildSelector(){
  const sel=document.getElementById('week-sel');sel.innerHTML='';
  const today=thisWeekKey(),next=getNextWeekKey();
  [...new Set(allWeeks)].sort().reverse().forEach(k=>{
    const opt=document.createElement('option');opt.value=k;
    let label=weekKeyToLabel(k);
    if(k===today)label+=' (이번 주)';else if(k===next)label+=' (다음 주)';
    opt.textContent=label;sel.appendChild(opt);
  });
  sel.value=curKey;updateUI(curKey);
}

function updateUI(key){
  const today=thisWeekKey(),next=getNextWeekKey();
  isRO=(key!==today&&key!==next);
  const isNext=(key===next&&key!==today);
  const badge=document.getElementById('wbadge');
  const nwBtn=document.getElementById('nw-btn');
  const nwHint=document.getElementById('wk-hint');
  const saveBtn=document.getElementById('save-btn');
  if(key===today){badge.textContent='이번 주';badge.className='wbadge now';}
  else if(key===next){badge.textContent='다음 주';badge.className='wbadge next';}
  else{badge.textContent='과거';badge.className='wbadge past';}
  const dow=new Date().getDay();
  const isThuSun=(dow>=4||dow===0);
  nwBtn.style.display=(isThuSun&&!allWeeks.includes(next)&&key===today)?'flex':'none';
  nwHint.style.display=(isThuSun&&!allWeeks.includes(next)&&key===today)?'block':'none';
  document.getElementById('ban-readonly').style.display=isRO?'block':'none';
  document.getElementById('ban-next').style.display=isNext?'block':'none';
  if(saveBtn)saveBtn.disabled=isRO;
  setTimeout(()=>{document.querySelectorAll('#pg-input textarea').forEach(el=>el.disabled=isRO);},50);
}

function updDot(id){

// VERSION HISTORY PANEL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openVerPanel(){
  document.getElementById('ver-panel').classList.add('open');
  document.getElementById('ver-overlay').classList.add('open');
  loadVerList();
}
function closeVerPanel(){
  document.getElementById('ver-panel').classList.remove('open');
  document.getElementById('ver-overlay').classList.remove('open');
}

async function loadVerList(){
  const list=document.getElementById('ver-list');
  list.innerHTML='<div class="ver-empty">불러오는 중...</div>';
  try{
    const r=await fetch(dbPath(curKey));
    if(!r.ok){list.innerHTML='<div class="ver-empty">기록을 불러올 수 없어요.</div>';return;}
    const d=await r.json();
    const history=(d&&d.history)||[];
    if(!history.length){list.innerHTML='<div class="ver-empty">아직 저장 기록이 없어요.</div>';return;}
    list.innerHTML='';
    history.forEach((v,i)=>{
      const dt=new Date(v.saved);
      const label=dt.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})+' '+dt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      const ago=timeAgo(dt);
      const item=document.createElement('div');item.className='ver-item';
      item.innerHTML=`<div class="ver-time">${i===0?'🔵 최신 · ':''} ${label}</div>
        <div class="ver-ago">${ago}</div>
        ${i>0?`<button class="ver-restore" onclick="restoreVer(${i})">이 버전으로 복원</button>`:'<div style="font-size:11px;color:var(--text3);">현재 저장된 버전</div>'}`;
      list.appendChild(item);
    });
  }catch{list.innerHTML='<div class="ver-empty">오류가 발생했어요.</div>';}
}

async function restoreVer(idx){
  const ok=confirm(`이 버전으로 복원할까요? 현재 작성 중인 내용은 사라질 수 있어요.`);
  if(!ok)return;
  try{
    const r=await fetch(dbPath(curKey));
    if(!r.ok)return;
    const d=await r.json();
    const history=(d&&d.history)||[];
    const v=history[idx];if(!v)return;
    const saved=v.members||[];
    ms=FIXED_MEMBERS.map((name,i)=>{
      const found=saved.find(m=>m.name===name)||mkM(i+1,name);
      found.id=i+1;found.name=name;return found;
    });
    ceo=v.ceo||'';
    document.getElementById('ceo-in').value=ceo;
    render();
    closeVerPanel();
    isDirty=true;
    setSt('복원됐어요. 저장 버튼을 눌러 확정해주세요.');
  }catch{alert('복원에 실패했어요.');}
}

function timeAgo(date){
  const diff=Math.floor((Date.now()-date)/1000);
  if(diff<60)return `${diff}초 전`;if(diff<3600)return `${Math.floor(diff/60)}분 전`;
  if(diff<86400)return `${Math.floor(diff/3600)}시간 전`;return `${Math.floor(diff/86400)}일 전`;
}

async function rHist(){
  const c=document.getElementById('hw-list');c.innerHTML='<div class="eh">불러오는 중...</div>';
  try{
    const r=await fetch(weeksPath());const all=r.ok?await r.json():{};
    const sorted=Object.keys(all||{}).sort().reverse();c.innerHTML='';
    if(!sorted.length){c.innerHTML='<div class="eh" style="padding:8px 0;">아직 기록된 주차가 없습니다</div>';return;}
    const today=thisWeekKey(),next=getNextWeekKey();
    sorted.forEach(k=>{
      const d=all[k]||{};const div=document.createElement('div');div.className='hw-card';
      div.onclick=()=>{document.getElementById('week-sel').value=k;onWeekChange(k);sw('input');};
      const mc=d.members?d.members.filter(m=>hasCont(m)).length:0;
      const upd=d.updated?new Date(d.updated).toLocaleDateString('ko-KR'):'';
      let tag='';
      if(k===today)tag='<span class="wbadge now" style="font-size:10px;">이번 주</span>';
      else if(k===next)tag='<span class="wbadge next" style="font-size:10px;">다음 주</span>';
      div.innerHTML=`<div><div style="font-size:14px;font-weight:600;">${weekKeyToLabel(k)}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:3px;">${mc}명 입력${upd?' · '+upd:''}</div></div>${tag}`;
      c.appendChild(div);
    });
  }catch{c.innerHTML='<div class="eh">로드 실패</div>';}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// COPY ALL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function cpAll(btn){
  collectValues();
  let t=`📋 ${weekKeyToLabel(curKey)} 인사팀 위클리 보고\n\n`;
  if(ceo.trim())t+=`[대표님 지시/요청사항]\n${ceo}\n\n`;
  ms.forEach(m=>{
    t+=`▪ ${m.name}\n`;
    CATS.forEach(cat=>{t+=`${cat.num}. ${cat.name}\n  한 일: ${m[`t_${cat.id}`]||'없음'}\n  할 일: ${m[`n_${cat.id}`]||'없음'}\n`;});
    if(m.notes)t+=`▶ 논의사항: ${m.notes}\n`;
    t+='\n';
  });
  navigator.clipboard.writeText(t).then(()=>{const o=btn.textContent;btn.textContent='복사됨!';setTimeout(()=>btn.textContent=o,1500);});
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SETTINGS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function changePw(){
  const p1=document.getElementById('npw1').value,p2=document.getElementById('npw2').value;
  const msg=document.getElementById('cpw-msg');
  if(!p1||p1.length<4){msg.style.color='var(--red)';msg.textContent='4자 이상 입력해주세요.';return;}
  if(p1!==p2){msg.style.color='var(--red)';msg.textContent='비밀번호가 일치하지 않습니다.';return;}
  msg.style.color='var(--text2)';msg.textContent='변경 중...';
  try{
    const h=await sha256(p1);
    const r=await fetch(authPath(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hash:h})});
    msg.style.color=r.ok?'var(--green)':'var(--red)';
    msg.textContent=r.ok?'변경 완료! 새 비밀번호를 팀원들에게 알려주세요.':'저장 실패.';
  }catch{msg.style.color='var(--red)';msg.textContent='오류가 발생했습니다.';}
  document.getElementById('npw1').value='';document.getElementById('npw2').value='';
}

init();
</script>
